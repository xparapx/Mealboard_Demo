<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>챕터 스탬프</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#26262A;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#FFFCF6}
  .wrap{position:absolute;inset:0}
  .glow{position:absolute;left:-200px;top:200px;width:900px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(31,138,133,.32),rgba(31,138,133,0));
        transform:scale(.6);opacity:0;animation:glow 1.1s cubic-bezier(.2,.8,.2,1) .05s forwards}
  .bar{position:absolute;left:120px;top:440px;width:16px;height:200px;border-radius:8px;background:#1F8A85;transform-origin:top;transform:scaleY(0);animation:bar .45s cubic-bezier(.2,.8,.2,1) .1s forwards}
  .num{position:absolute;left:190px;top:420px;font-size:96px;font-weight:700;color:#1F8A85;opacity:0;transform:translateY(26px) scale(1.25);animation:num .55s cubic-bezier(.2,.8,.2,1) .25s forwards}
  .ttl{position:absolute;left:400px;top:440px;font-size:84px;font-weight:700;letter-spacing:-.01em;opacity:0;transform:translateX(70px);filter:blur(10px);animation:ttl .7s cubic-bezier(.2,.8,.2,1) .35s forwards}
  .sub{position:absolute;left:404px;top:560px;font-size:40px;color:#CFE7E4;opacity:0;transform:translateY(18px);animation:sub .6s ease-out .75s forwards}
  .line{position:absolute;left:404px;top:640px;height:3px;width:0;background:linear-gradient(90deg,#1F8A85,rgba(31,138,133,0));animation:line .9s cubic-bezier(.2,.8,.2,1) .8s forwards}
  .brand{position:absolute;right:120px;bottom:70px;font-size:28px;color:#8A8A90;opacity:0;animation:sub .6s ease-out 1.0s forwards}
  @keyframes glow{to{transform:scale(1);opacity:1}}
  @keyframes bar{to{transform:scaleY(1)}}
  @keyframes num{to{opacity:1;transform:none}}
  @keyframes ttl{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes sub{to{opacity:1;transform:none}}
  @keyframes line{to{width:900px}}
</style></head><body>
<div class="wrap">
  <div class="glow"></div><div class="bar"></div>
  <div class="num" id="n"></div><div class="ttl" id="t"></div><div class="sub" id="s"></div><div class="line"></div>
  <div class="brand">Mealboard · 밀보드</div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("n").textContent = q.get("n") || "01";
document.getElementById("t").textContent = q.get("t") || "";
document.getElementById("s").textContent = q.get("s") || "";
</script>
</body></html>
