[project]
name = "mealboard"
version = "0.1.0"
description = "학교 급식실 대기시간 + 급식 영양 대시보드"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pyjwt[crypto]>=2.13.0",
]

# vision(카메라 카운팅 노드) 의존성 — 선언하지 않으면 `uv sync` 가 venv 에서 지운다(09-11 실증: 관리 앱 pyjwt 추가 sync 뒤 ultralytics 가 사라져 석식 창에 vision 이 죽었다).
# Pi 에서 `uv sync --group vision`. hailort 는 PyPI 에 없어 setup_pi.sh 가 data/models/*.whl 로 따로 넣는다. picamera2 는 시스템 패키지(--system-site-packages).
[project.optional-dependencies]
vision = ["ultralytics>=8.4", "torch>=2.14", "torchvision>=0.29", "opencv-python>=4.10"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
