<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급식실 대기 안내</title>
<link rel="manifest" href="/manifest.json">
<style>
  /* 팔레트: docs/layout.html 도면 v4 — ColorCombos #285 (차콜·에그셸·멜론). 그림자 없음, 구분은 선과 채움색으로만 */
  :root { --char:#505050; --egg:#FFF5C3; --egg2:#FFFBE4; --paper:#FFFDF5;
          --teal:#129793; --aqua:#9BD7D5; --melon:#FF7260;
          --ink:#2B2B2B; --mute:#7A7A72; --soft:#E6DFB8; --off:#BDBDB5; }
  body { font-family: "Pretendard", system-ui, sans-serif; margin: 0; background: var(--egg); color: var(--ink);
         font-variant-numeric: tabular-nums; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: var(--paper); border: 1.5px solid var(--char); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .2em; color: var(--mute); font-weight: 800; }
  /* 히어로(식권 카드) 4가지 얼굴: ok=차콜+아쿠아 칩 · wait=차콜+멜론 외곽선 칩 · busy=멜론 카드+차콜 칩 · off=점선 */
  .hero { background: var(--char); color: var(--egg); position: relative; }
  .hero .eyebrow { color: var(--egg); opacity: .75; }
  .hero[data-level="busy"] { background: var(--melon); color: #000; }
  .hero[data-level="busy"] .eyebrow { color: #000; opacity: .7; }
  .hero[data-level="off"] { background: var(--egg2); color: var(--ink); border-style: dashed; }
  .hero[data-level="off"] .eyebrow { color: var(--mute); opacity: 1; }
  .wait { font-size: 92px; font-weight: 800; line-height: .9; letter-spacing: -.04em; color: #fff; }
  .hero[data-level="busy"] .wait { color: #000; }
  .hero[data-level="off"] .wait { color: var(--off); }
  .wait small { font-size: 22px; font-weight: 600; margin-left: 4px; opacity: .9; }
  #state { display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 999px; font-size: 13px;
           font-weight: 800; border: 1.5px solid var(--aqua); background: var(--aqua); color: var(--char); }
  .hero[data-level="wait"] #state { background: transparent; color: var(--melon); border-color: var(--melon); }
  .hero[data-level="busy"] #state { background: var(--char); color: var(--egg); border-color: var(--char); }
  .hero[data-level="off"] #state { background: transparent; color: var(--mute); border-color: var(--off); }
  .dot { position: absolute; right: 18px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--teal); }  /* 라이브 */
  .hero[data-level="busy"] .dot { background: var(--char); }
  .hero[data-level="off"] .dot { background: var(--off); }
  .row { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 12px; font-size: 13px; }
  .hero .row { border-top: 1px dashed rgba(255,245,195,.35); }
  .hero .row b { color: #fff; }
  .hero[data-level="busy"] .row { border-top-color: rgba(0,0,0,.3); }
  .hero[data-level="busy"] .row b { color: #000; }
  .hero[data-level="off"] .row { border-top-color: var(--soft); }
  .hero[data-level="off"] .row b { color: var(--ink); }
  .row b { font-size: 16px; font-weight: 800; }
  .muted { color: var(--mute); font-size: 11px; }
  canvas { width: 100%; height: 72px; display: block; border-bottom: 1.5px solid var(--char); margin-top: 8px; }
  ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; }
  li { padding-left: 14px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--char); }
  li:first-child { grid-column: 1 / -1; font-weight: 800; font-size: 15px; }
  li:first-child::before { background: var(--melon); border-color: var(--melon); }
  /* 영양 3칸: 색은 칸의 정체성(01 틸 · 02 아쿠아 · 03 멜론), 상태는 우상단 플래그 — 둘을 섞지 않는다 */
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; counter-reset: k; }
  .kpi > div { border: 1.5px solid var(--char); border-radius: 12px; padding: 8px 10px; position: relative; counter-increment: k; }
  .kpi > div:nth-child(1) { background: var(--teal); color: #000; }
  .kpi > div:nth-child(2) { background: var(--aqua); color: var(--char); }
  .kpi > div:nth-child(3) { background: var(--melon); color: #000; }
  .kpi > div::before { content: "0" counter(k); font-size: 10px; font-weight: 800; letter-spacing: .1em; opacity: .7; display: block; }
  .kpi b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .kpi span { font-size: 11px; opacity: .8; }
  .kpi .flag { position: absolute; right: 8px; top: 8px; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px;
               background: rgba(0,0,0,.18); opacity: 1; }
  .kpi .flag:empty { display: none; }
  details summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--teal); font-weight: 800; letter-spacing: .08em; margin-top: 12px; }
  details summary::-webkit-details-marker { display: none; }
  /* 영양소 막대: seaborn pastel 6색을 영양소 key 에 매핑(순서가 바뀌어도 유지). 부족은 막대색 유지 + 멜론 외곽선 + 라벨. 수용성 비타민은 과다 없음 */
  .bar { display: grid; grid-template-columns: 90px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; margin: 5px 0; }
  .track { position: relative; height: 10px; background: var(--egg2); border: 1.5px solid var(--char); border-radius: 6px; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; }
  .bar[data-k="vitA"] .track i { background: #A1C9F4; }
  .bar[data-k="b1"] .track i { background: #FFB482; }
  .bar[data-k="b2"] .track i { background: #8DE5A1; }
  .bar[data-k="vitC"] .track i { background: #FF9F9B; }
  .bar[data-k="ca"] .track i { background: #D0BBFF; }
  .bar[data-k="fe"] .track i { background: #DEBB9B; }
  .bar.short .track { border-color: var(--melon); box-shadow: inset 0 0 0 1px var(--melon); }
  .bar.short b { color: var(--melon); }
  .bar.short b::after { content: " 부족"; font-size: 10px; }
  .track::after { content: ""; position: absolute; left: 66.7%; top: -5px; bottom: -5px; width: 2px; background: var(--melon); }  /* 권장섭취량 100% */
  .bar b { text-align: right; font-weight: 800; }
</style>
</head>
<body>
<main>
  <section class="card hero" id="hero" data-level="ok">
    <span class="dot"></span>
    <div class="eyebrow">지금 줄을 서면</div>
    <div class="wait"><span id="wait">—</span><small>분</small></div>
    <span id="state">—</span>
    <div class="row">
      <div><b id="queue">—</b>명 대기 중</div>
      <div><b id="rate">—</b>명/분 배식 속도</div>
    </div>
  </section>
  <div class="muted" style="display:flex;justify-content:space-between;padding:6px 4px 10px">
    <span>갱신 <span id="updated"></span> · 30초마다</span><span>추정치 · 배식 초반 오차 큼</span>
  </div>

  <section class="card">
    <div class="eyebrow">최근 2시간 예상 대기</div>
    <canvas id="chart" width="600" height="120"></canvas>
  </section>

  <section class="card">
    <div class="eyebrow">오늘 중식</div>
    <ul id="menu"></ul>
    <div class="kpi">
      <div><b id="energy">—</b><span>에너지 충족</span><span class="flag" id="energyflag"></span></div>
      <div><b id="ratio">—</b><span>탄·단·지 비율</span></div>
      <div><b id="mar">—</b><span>미량영양소</span><span class="flag" id="marflag"></span></div>
    </div>
    <details><summary>▸ 영양소별 보기</summary><div id="micro" style="margin-top:8px"></div></details>
    <div class="muted" id="stdnote" style="margin-top:8px"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const j = async u => (await fetch(u, { cache: "no-store" })).json();
const BUSY_MIN = 12, EASY_MIN = 5;           // 판정 임계값 (학교마다 다를 수 있음)
function level(st) {
  if (st.state === "no_data") return "off";
  if (st.state === "insufficient_rate") return "wait";
  return st.wait_min > BUSY_MIN ? "busy" : "ok";
}
function verdict(st) {
  return { off: "정보 없음", wait: "배식 시작 대기",
           busy: "혼잡 · 잠시 후 추천",
           ok: st.wait_min <= EASY_MIN ? "여유 · 바로 가세요" : "보통" }[level(st)];
}

async function refresh() {
  const st = await j("/api/status");
  $("#wait").textContent = st.wait_min == null ? "—" : st.wait_min;
  $("#queue").textContent = st.queue_len ?? "—";
  $("#rate").textContent = st.rate_per_min ?? "—";
  $("#state").textContent = verdict(st);
  $("#hero").dataset.level = level(st);
  $("#updated").textContent = st.updated_at
    ? new Date(st.updated_at).toLocaleTimeString("ko-KR") : "-";
  const h = await j("/api/history?minutes=120");
  drawChart(h.rows);
}

function drawChart(rows) {
  const c = $("#chart"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const pts = rows.filter(r => r.wait_min != null);
  if (pts.length < 2) return;
  const max = Math.max(5, ...pts.map(r => r.wait_min));
  const xy = pts.map((r, i) => [i / (pts.length - 1) * c.width,
                                c.height - r.wait_min / max * (c.height - 10) - 5]);
  // 면 채움: 위(높은 값)로 갈수록 진한 틸, 아래는 투명 — 봉우리가 스스로 강조된다
  const grad = g.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, "rgba(18,151,147,.9)");
  grad.addColorStop(.55, "rgba(18,151,147,.35)");
  grad.addColorStop(1, "rgba(155,215,213,0)");
  g.beginPath();
  xy.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.lineTo(c.width, c.height); g.lineTo(0, c.height); g.closePath();
  g.fillStyle = grad; g.fill();
  g.beginPath(); g.strokeStyle = "#129793"; g.lineWidth = 2;
  xy.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.stroke();
}

async function loadMeal() {
  const m = await j("/api/meal");
  if (m.state !== "ok" || !m.today) {
    $("#menu").innerHTML = "<li>" + (m.state === "no_meal"
      ? "이번 주 급식 정보가 없습니다" : "급식 정보를 아직 받지 못했습니다") + "</li>";
    return;
  }
  $("#menu").innerHTML = m.today.menu.map(x => `<li>${x}</li>`).join("");
  const a = m.today.assess;
  $("#energy").textContent = a.energy_pct == null ? "—" : a.energy_pct + "%";
  $("#energyflag").textContent = a.energy_pct == null ? ""
    : a.energy_pct > 110 ? "많음" : a.energy_pct < 90 ? "적음" : "";
  $("#ratio").textContent = a.macro_ratio_ok ? "적정" : "범위 밖";
  $("#ratio").title = `탄 ${a.macro_ratio.carb} · 단 ${a.macro_ratio.protein} · 지 ${a.macro_ratio.fat} %`;
  $("#mar").textContent = a.mar == null ? "—" : a.mar + "%";
  const short = a.micro.filter(x => x.band === "부족").length;
  $("#marflag").textContent = short ? `부족 ${short}` : "";
  $("#micro").innerHTML = a.micro.map(x =>
    `<div class="bar${x.band === "부족" ? " short" : ""}" data-k="${x.key}"><span>${x.label}</span>
       <div class="track"><i style="width:${Math.min(x.pct, 150) / 1.5}%"></i></div>
       <b>${x.pct}%</b></div>`).join("");
  $("#stdnote").textContent =
    `기준: ${m.std.group} · ${m.std.source} · 멜론 세로선 = 권장섭취량. 영양교사 산출값 기준 참고 지표입니다.`;
}

refresh(); loadMeal();
setInterval(refresh, 30000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
